  <text x="873.3333333333333" y="492" text-anchor="middle" fill="#3B82F6" font-size="58" font-weight="900">+4,225억</text>
  <text x="873.3333333333333" y="534" text-anchor="middle" fill="#94A3B8" font-size="18">개인과 지수 방어</text>
  
  <rect x="48" y="584" width="240" height="42" fill="rgba(59,130,246,0.102)" rx="21" stroke="rgba(59,130,246,0.333)" stroke-width="1"/>
  <text x="168.0" y="611" text-anchor="middle" fill="#3B82F6" font-size="18" font-weight="700">SK하이닉스 +5.32%</text>
  <rect x="298" y="584" width="240" height="42" fill="rgba(59,130,246,0.102)" rx="21" stroke="rgba(59,130,246,0.333)" stroke-width="1"/>
  <text x="418.0" y="611" text-anchor="middle" fill="#3B82F6" font-size="18" font-weight="700">SK스퀘어 +10.34%</text>
  <rect x="548" y="584" width="208" height="42" fill="rgba(59,130,246,0.102)" rx="21" stroke="rgba(59,130,246,0.333)" stroke-width="1"/>
  <text x="652.0" y="611" text-anchor="middle" fill="#3B82F6" font-size="18" font-weight="700">삼성물산 +7.63%</text>
  <rect x="766" y="584" width="208" height="42" fill="rgba(59,130,246,0.102)" rx="21" stroke="rgba(59,130,246,0.333)" stroke-width="1"/>
  <text x="870.0" y="611" text-anchor="middle" fill="#3B82F6" font-size="18" font-weight="700">LG전자 +7.33%</text>
  <rect x="48" y="636" width="208" height="42" fill="rgba(59,130,246,0.102)" rx="21" stroke="rgba(59,130,246,0.333)" stroke-width="1"/>
  <text x="152.0" y="663" text-anchor="middle" fill="#3B82F6" font-size="18" font-weight="700">비비안 +30.00%</text>
  

  <!-- 인용구 박스 -->
  <rect x="48" y="910" width="984" height="120" fill="#1E3A5F" rx="16" opacity="0.75"/>
  <rect x="48" y="910" width="6" height="120" fill="#3B82F6" rx="3"/>
  <text x="76" y="954" fill="#3B82F6" font-size="38" font-weight="900">"</text>
  <text x="104" y="960" fill="#FFFFFF" font-size="32" font-weight="800">외국인 2.5조 매도 뚫은 반도체 — SK하이닉스가 시총 1위에 오른 날</text>
  <text x="76" y="1002" fill="#94A3B8" font-size="20" font-weight="700">— </text>

