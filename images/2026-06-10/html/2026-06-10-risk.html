<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
  /* 로컬 NanumGothic Bold/ExtraBold만 사용 — Regular(400)는 제거해서 항상 굵은 글자 보장 */
  @font-face { font-family: 'NanumGothic'; src: local('NanumGothic Bold'), local('NanumGothicBold'), local('나눔고딕 Bold'); font-weight: 700; }
  @font-face { font-family: 'NanumGothic'; src: local('NanumGothicExtraBold'), local('NanumGothic ExtraBold'), local('나눔고딕 ExtraBold'); font-weight: 800 900; }
  /* 400 weight 요청 시에도 700으로 폴백 */
  @font-face { font-family: 'NanumGothic'; src: local('NanumGothic Bold'), local('NanumGothicBold'); font-weight: 1 400; }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  html, body { width: 1080px; height: 1080px; overflow: hidden; background: transparent; }
  svg { width: 1080px; height: 1080px; display: block; }
</style></head>
<body><svg viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg" font-family="'NanumGothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
<defs>
  <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" style="stop-color:#0F172A"/>
    <stop offset="100%" style="stop-color:#1E293B"/>
  </linearGradient>
  <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" style="stop-color:#EF4444"/>
    <stop offset="100%" style="stop-color:#F97316"/>
  </linearGradient>
  <linearGradient id="hero" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" style="stop-color:#EF4444"/>
    <stop offset="100%" style="stop-color:#FBBF24"/>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>

  <!-- 상단 accent bar -->
  <rect x="0" y="0" width="1080" height="8" fill="url(#accent)"/>

  <!-- 섹션 라벨 -->
  <text x="48" y="80" fill="#64748B" font-size="24" font-weight="700" letter-spacing="6">RISK FACTORS</text>

  <!-- 메인 타이틀 -->
  <text x="48" y="148" fill="#FFFFFF" font-size="58" font-weight="800">변동장 리스크 체크</text>

  <!-- 디바이더 -->
  <rect x="48" y="160" width="100" height="5" fill="url(#accent)" rx="2"/>

  
  <text x="48" y="320" fill="url(#hero)" font-size="120" font-weight="900" filter="url(#glow)">반응 NO · 대응 YES</text>
  <text x="48" y="358" fill="#94A3B8" font-size="22" font-weight="700">[광수생각] 변동장 생존법</text>
  
  <rect x="48.0" y="400" width="317.3333333333333" height="150" fill="#1E293B" rx="14" stroke="#334155" stroke-width="1"/>
  <text x="206.66666666666666" y="436" text-anchor="middle" fill="#64748B" font-size="17" font-weight="700" letter-spacing="2">안전장치 발동</text>
  <text x="206.66666666666666" y="496" text-anchor="middle" fill="#EF4444" font-size="48" font-weight="900">3일 연속</text>
  <text x="206.66666666666666" y="530" text-anchor="middle" fill="#94A3B8" font-size="17">CB→매수SC→매도SC</text>
  <rect x="381.3333333333333" y="400" width="317.3333333333333" height="150" fill="#1E293B" rx="14" stroke="#334155" stroke-width="1"/>
  <text x="540.0" y="436" text-anchor="middle" fill="#64748B" font-size="17" font-weight="700" letter-spacing="2">미국 물가 발표</text>
  <text x="540.0" y="496" text-anchor="middle" fill="#EF4444" font-size="48" font-weight="900">CPI</text>
  <text x="540.0" y="530" text-anchor="middle" fill="#94A3B8" font-size="17">금리 인하 기대 분수령</text>
  <rect x="714.6666666666666" y="400" width="317.3333333333333" height="150" fill="#1E293B" rx="14" stroke="#334155" stroke-width="1"/>
  <text x="873.3333333333333" y="436" text-anchor="middle" fill="#64748B" font-size="17" font-weight="700" letter-spacing="2">이란 공습 재개</text>
  <text x="873.3333333333333" y="496" text-anchor="middle" fill="#EF4444" font-size="48" font-weight="900">호르무즈</text>
  <text x="873.3333333333333" y="530" text-anchor="middle" fill="#94A3B8" font-size="17">중동 리스크 재점화</text>
  
  <rect x="48" y="574" width="240" height="42" fill="#EF44441A" rx="21" stroke="#EF444455" stroke-width="1"/>
  <text x="168.0" y="601" text-anchor="middle" fill="#EF4444" font-size="18" font-weight="700">헤드라인 반응 매매 금지</text>
  <rect x="298" y="574" width="208" height="42" fill="#EF44441A" rx="21" stroke="#EF444455" stroke-width="1"/>
  <text x="402.0" y="601" text-anchor="middle" fill="#EF4444" font-size="18" font-weight="700">발표 직전 베팅 금지</text>
  <rect x="516" y="574" width="192" height="42" fill="#EF44441A" rx="21" stroke="#EF444455" stroke-width="1"/>
  <text x="612.0" y="601" text-anchor="middle" fill="#EF4444" font-size="18" font-weight="700">수급·거래대금 확인</text>
  
  <text x="48" y="652" fill="#64748B" font-size="17" font-weight="700" letter-spacing="2">주요 포인트</text>
  <circle cx="60" cy="683" r="13" fill="#EF4444"/>
  <text x="60" y="688" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="800">1</text>
  <text x="84" y="690" fill="#FFFFFF" font-size="21" font-weight="700">폭락 헤드라인에 '반응'하면 어제 8% 반등을 놓치고 오늘 4.5% 하락을 맞는다</text>
  <circle cx="60" cy="723" r="13" fill="#EF4444"/>
  <text x="60" y="728" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="800">2</text>
  <text x="84" y="730" fill="#FFFFFF" font-size="21" font-weight="700">CPI 발표 전 포지션 베팅은 투자가 아니라 동전 던지기</text>
  <circle cx="60" cy="763" r="13" fill="#EF4444"/>
  <text x="60" y="768" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="800">3</text>
  <text x="84" y="770" fill="#FFFFFF" font-size="21" font-weight="700">외국인 매도 감소 여부·거래대금 실리는 종목이 진짜 신호</text>

  <!-- 인용구 박스 -->
  <rect x="48" y="910" width="984" height="120" fill="#1E3A5F" rx="16" opacity="0.75"/>
  <rect x="48" y="910" width="6" height="120" fill="#EF4444" rx="3"/>
  <text x="76" y="954" fill="#EF4444" font-size="38" font-weight="900">"</text>
  <text x="104" y="960" fill="#FFFFFF" font-size="32" font-weight="800">떨리는 손이 아니라 미리 적어둔 원칙이 주문을 내야 한다</text>
  <text x="76" y="1002" fill="#94A3B8" font-size="20" font-weight="700">— 광수생각 '반응말고 대응하자' 中 해석</text>

  <!-- 우측 하단 브랜딩 -->
  <text x="1032" y="1058" text-anchor="end" fill="#64748B" font-size="17" font-weight="700" letter-spacing="1">12시에 만나요 · 주식 분석 블로그</text>

</svg></body></html>
